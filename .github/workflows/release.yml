name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
  docker:
    uses: ./.github/workflows/docker.yml

  package-linux:
    name: Package Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [test, security]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: |
          apt-get update && apt-get install -y dpkg rpm
          cargo install cargo-deb cargo-rpm --locked
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --features graphrag,ort-dynamic,comms
      - name: Build .deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo deb --target ${{ matrix.target }}
      - name: Build .rpm
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo rpm --target ${{ matrix.target }}
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/debian/*.deb
            target/${{ matrix.target }}/release/rpmbuild/RPMS/*/*.rpm

  package-macos:
    name: Package macOS
    runs-on: macos-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --features graphrag,ort-dynamic,comms
      - name: Create .pkg
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --format pkg
      - name: Create .dmg
        run: |
          hdiutil create -volname "hacienda-backend" \
            -srcfolder target/release/bundle/osx/hacienda-backend.app \
            -ov -format UDZO hacienda-backend-${{ github.ref_name }}-macos.dmg
      - name: Sign and notarize
        if: env.APPLE_DEVELOPER_ID != ''
        run: |
          codesign --force --options runtime \
            --sign "${APPLE_DEVELOPER_ID}" \
            target/release/bundle/osx/hacienda-backend.app
          xcrun notarytool submit hacienda-backend-${{ github.ref_name }}-macos.dmg \
            --apple-id "${APPLE_ID}" \
            --team-id "${TEAM_ID}" \
            --password "${NOTARY_PASSWORD}" \
            --wait
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            target/release/bundle/osx/*.pkg
            *.dmg

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --features graphrag,ort-dynamic,comms
      - name: Create .msi
        run: |
          cargo install cargo-wix --locked
          cargo wix --release
      - name: Sign
        if: env.WINDOWS_CERT != ''
        run: |
          $cert = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERT }}")
          $pwd = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -AsPlainText -Force
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          signtool sign /f cert.pfx /p ${{ secrets.WINDOWS_CERT_PASSWORD }} \
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 \
            target/wix/*.msi
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: target/wix/*.msi

  package-mcp-npm:
    name: Package MCP npm
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Build MCP extension
        run: |
          cd mcp-extension
          npm ci
          npm run build
          npm version ${{ github.ref_name }}
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  package-vscode:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package VS Code extension
        run: |
          cd vscode-extension
          npm ci
          npx vsce package --out hacienda-backend-${{ github.ref_name }}.vsix
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }}

  package-opencode:
    name: Package OpenCode/Pi Extension
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenCode plugin
        run: |
          cd opencode-plugin
          npm ci
          npm run build
          tar -czf opencode-plugin-${{ github.ref_name }}.tar.gz dist/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: opencode-plugin
          path: opencode-plugin-${{ github.ref_name }}.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-linux, package-macos, package-windows, package-mcp-npm, package-vscode, package-opencode]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/packages-*/*.deb
            artifacts/packages-*/*.rpm
            artifacts/packages-macos/*.pkg
            artifacts/packages-macos/*.dmg
            artifacts/packages-windows/*.msi
            vscode-extension/*.vsix
            opencode-plugin/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
[package]
name = "hacienda-backend"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Bridge between CertaMesh/gaze (fail-closed PII pseudonymization) and the basemind agent context layer"
publish = true

[dependencies]
async-trait = "0.1.92"
gaze-assembly = "=0.17.0"
gaze-pii = "=0.17.0"
thiserror = "2.0.11"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.19"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
shellexpand = "0.1.0"
clap = { version = "4.5.19", features = ["derive", "env"] }
dialoguer = "0.11.0"
console = "0.15.8"
chrono = { version = "0.4.38", features = ["serde"] }
rand = "0.9.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
rmcp = { version = "0.2.1", features = ["server-side-http", "transport-async-rw"] }
axum = { version = "0.7.9", features = ["macros"] }
tracing = "0.1.40"
tower = "0.5.2"
tower-http = { version = "0.5.2", features = ["cors"] }
notify = { version = "6.1.1", features = ["macos_fsevent"] }
crossbeam-channel = "0.5.13"
hpke = "0.15.0"
security-framework = { version = "3.7.0", features = ["sync-keychain"] }
blake3 = "1.7.1"
xberg = { version = "=1.3.9", features = ["redaction", "redaction-rehydrate"] }

[profile.release]
lto = "thin"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
zip = "9.0.2"
xberg = { version = "=1.3.9", features = ["office", "pdf", "excel"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }

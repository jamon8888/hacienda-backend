[package]
name = "hacienda-backend"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Bridge between CertaMesh/gaze (fail-closed PII pseudonymization) and the basemind agent context layer"
publish = true

[features]
default = ["bm25"]
bm25 = []
# Vector search via basemind's LanceStore (patched xberg 1.3.10 in /Users/macbook/xberg-patched)
basemind = ["dep:basemind", "dep:lancedb", "dep:arrow"]
vector = ["basemind"]
# Cross-encoder reranking with ort (bge-reranker-v2-m3 ONNX)
# On Linux/Windows: uses download-binaries feature
rerank = ["dep:ort", "dep:ndarray", "dep:reqwest"]
# On macOS: uses load-dynamic (requires ONNX Runtime installed via brew install onnxruntime)
rerank-macos = ["rerank", "ort/load-dynamic"]

[dependencies]
async-trait = "0.1.92"
anyhow = "1.0.93"
gaze-assembly = "=0.17.0"
gaze-pii = "=0.17.0"
thiserror = "2.0.11"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.19"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
shellexpand = "0.1.0"
clap = { version = "4.5.19", features = ["derive", "env"] }
dialoguer = "0.11.0"
console = "0.15.8"
chrono = { version = "^0.4.39", features = ["serde"] }
rand = "0.9.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
rmcp = { version = "0.2.1", features = ["server-side-http", "transport-async-rw"] }
axum = { version = "0.7.9", features = ["macros"] }
tracing = "0.1.40"
tower = "0.5.2"
tower-http = { version = "0.5.2", features = ["cors"] }
notify = { version = "6.1.1", features = ["macos_fsevent"] }
crossbeam-channel = "0.5.13"
hpke = "0.15.0"
security-framework = { version = "3.7.0", features = ["sync-keychain"] }
blake3 = "1.7.1"
xberg = { version = "=1.3.10", features = ["embeddings", "redaction", "redaction-rehydrate"] }

# BM25 search dependencies (always available)
tantivy = { version = "0.22.0", features = ["default"] }

# Optional basemind integration (Epic 14) – vector + lexical search via basemind's LanceStore + FTS.
# BLOCKED: xberg 1.3.8+ has bugs in LLM/reranker code (missing fields in RerankRequest, EmbeddingRequest, LlmConfig)
# Patched xberg 1.3.10 in /Users/macbook/xberg-patched
basemind = { path = "../basemind-ner-windowing", features = ["documents", "memory", "code-search", "comms"], optional = true }
lancedb = { version = "0.40", optional = true }
arrow = { version = "54", optional = true }

# Optional cross-encoder reranking with ort (bge-reranker-v2-m3 ONNX)
# On Linux/Windows: uses download-binaries feature
# On macOS: uses load-dynamic (requires ONNX Runtime installed via brew install onnxruntime)
ort = { version = "^2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-rustls"], optional = true }
ndarray = { version = "0.16", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "^2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "load-dynamic"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
zip = "9.0.2"
xberg = { version = "=1.3.10", features = ["embeddings", "redaction", "redaction-rehydrate"] }

[patch.crates-io]
gaze-assembly = { path = "/Users/macbook/gaze/crates/gaze-assembly" }
gaze-pii = { path = "/Users/macbook/gaze/crates/gaze" }
gaze-recognizers = { path = "/Users/macbook/gaze/crates/gaze-recognizers" }
xberg = { path = "/Users/macbook/xberg-patched" }

# Note: ort is now optional and uses download-binaries feature.
# The target-specific ort dependency was removed since we use the same configuration as gaze-recognizers.
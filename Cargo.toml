[package]
name = "hacienda-backend"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Bridge between CertaMesh/gaze (fail-closed PII pseudonymization) and the basemind agent context layer"
publish = true

[features]
default = ["bm25"]
bm25 = []
# Vector search via basemind's LanceStore. xberg is resolved from its pinned published package;
# no developer-local Cargo patch is part of the supported dependency graph.
basemind = ["dep:basemind", "dep:lancedb", "dep:arrow", "xberg/embeddings"]
vector = ["basemind"]
xberg-formats = ["xberg/formats"]
# Cross-encoder reranking with ort (bge-reranker-v2-m3 ONNX)
# On non-macOS targets: uses download-binaries feature.
# macOS Intel is configured below to use the system ONNX Runtime dynamically.
rerank = ["dep:ort", "dep:ndarray", "dep:reqwest", "dep:tokenizers", "dep:sha2"]
# On macOS: uses load-dynamic (requires ONNX Runtime installed separately).
rerank-macos = ["rerank", "ort/load-dynamic"]

[dependencies]
async-trait = "0.1.92"
anyhow = "1.0.93"
# PII core: pinned to the fork branch carrying the ort ^2.0.0-rc.13 relaxation.
# (crates.io has no 0.17.0 gaze releases; keep version-free git deps here.)
gaze-assembly = { git = "https://github.com/jamon8888/gaze", rev = "17ab8aec1be46595dd28b342d4a264d73e02d448" }
gaze-pii = { git = "https://github.com/jamon8888/gaze", rev = "17ab8aec1be46595dd28b342d4a264d73e02d448" }
thiserror = "2.0.11"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.19"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
shellexpand = "0.1.0"
clap = { version = "4.5.19", features = ["derive", "env"] }
dialoguer = "0.11.0"
console = "0.15.8"
chrono = { version = "^0.4.39", features = ["serde"] }
dirs = "5.0"
rand = "0.9.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = "1.9"
ed25519-dalek = "2.2"
base64 = "0.22"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-async-rw"] }
axum = { version = "0.7.9", features = ["macros"] }
tracing = "0.1.40"
tower = "0.5.2"
tower-http = { version = "0.5.2", features = ["cors"] }
notify = { version = "6.1.1", features = ["macos_fsevent"] }
crossbeam-channel = "0.5.13"
hpke = "0.15.0"
security-framework = { version = "3.7.0", features = ["sync-keychain"] }
blake3 = "1.7.1"
xberg = { version = "=1.3.10", default-features = false, features = ["tokio-runtime", "simd-utf8", "redaction", "redaction-rehydrate"] }

# BM25 search dependencies (always available)
tantivy = { version = "0.22.0", features = ["default"] }

# Optional basemind integration (Epic 14) – vector + lexical search via basemind's LanceStore + FTS.
# Pinned to the released 0.35.0 commit; requires the published xberg 1.3.10 contract.
basemind = { git = "https://github.com/jamon8888/basemind", rev = "dff67c5631b0d8e472dec3d0cc9722b7b1a4a1d9", features = ["documents", "memory", "code-search", "comms", "graphrag"], optional = true }
lancedb = { version = "0.40", optional = true }
arrow = { version = "54", optional = true }

# Optional cross-encoder reranking with ort (bge-reranker-v2-m3 ONNX)
# The transitive gaze recognizers use the same `ort` package. Keep the normal
# dependency portable, then add the download feature only off macOS. This
# prevents ort-sys from trying to fetch an unavailable Intel macOS archive.
ort = { version = "^2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "tls-rustls"], optional = true }
ndarray = { version = "0.16", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "^2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-rustls"], optional = true }

# gaze-recognizers also depends on `ort`. This non-optional target dependency
# ensures every Intel macOS build uses the same dynamic-linking mode, including
# the default and basemind configurations that still compile gaze recognizers.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "^2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "load-dynamic"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
zip = "9.0.2"
xberg = { version = "=1.3.10", default-features = false, features = ["tokio-runtime", "simd-utf8", "redaction", "redaction-rehydrate"] }

# No [patch.crates-io] override is supported. Clean checkouts and CI must resolve the
# published dependency graph without a developer-local absolute path.

[profile.ci]
inherits = "dev"
debug = 0
incremental = true
[[test]]
name = "corpus"
path = "tests/corpus.rs"
required-features = ["xberg-formats"]

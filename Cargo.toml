[package]
name = "hacienda-backend"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "Bridge between CertaMesh/gaze (fail-closed PII pseudonymization) and the basemind agent context layer"
publish = true

[dependencies]
async-trait = "0.1.92"
gaze-assembly = "=0.17.0"
gaze-pii = "=0.17.0"
thiserror = "2.0.11"
# Exact pin: the composition seam (register_post_processor same-name replacement,
# extract_with_external_redaction, findings shape) was contract-verified against 1.3.9.
# Bumping means re-running the ADR-0001 verification first (ADR-0002 fingerprint covers config, not crate drift).
# "redaction" feature: the external-findings rewrite engine is feature-gated.
xberg = { version = "=1.3.9", features = ["redaction"] }

[profile.release]
lto = "thin"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# Ticket #5: fixture corpus needs the Office + PDF engines. Declared again
# here so the runtime dependency surface stays minimal (redaction only).
zip = "9.0.2"
# "excel" is a separate feature from "office" (the ExcelExtractor registers
# under `cfg(any(feature = "excel", feature = "excel-wasm"))`); without it the
# spreadsheet MIME fails with UnsupportedFormat.
xberg = { version = "=1.3.9", features = ["office", "pdf", "excel"] }

# Intel macOS workaround (hacienda-backend#5): ort-sys 2.0.0-rc.12 (pinned by
# gaze-recognizers 0.17.0) ships no prebuilt ONNX Runtime for
# x86_64-apple-darwin, so its build script fails closed. `load-dynamic` maps
# to ort-sys/disable-linking: no download, no linking; ort dlopens a dylib
# (ORT_DYLIB_PATH) only if its API is actually used — the harness never does
# (NER/GLiNER is opt-in and not configured here). Target-gated so every other
# platform keeps the prebuilt-binary default. Dependency-local by design; the
# upstream fix (pin ort to rc.13, which added x86_64-apple-darwin prebuilts)
# is a tracked upstream-contribution candidate, out of scope for this map.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
